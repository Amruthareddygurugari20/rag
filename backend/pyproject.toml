[project]
name = "judge-check"
version = "0.0.1"
description = "Measure how far you can trust the LLM judge in your RAG evaluation."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a reachable Postgres+pgvector (skipped locally if absent, fatal when JUDGE_CHECK_REQUIRE_DB=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
