name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: judge_check
          POSTGRES_PASSWORD: judge_check
          POSTGRES_DB: judge_check_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U judge_check -d judge_check_test" --health-interval 2s --health-retries 30
    env:
      # Marked tests fail instead of skipping if the database or model is missing (D-009).
      JUDGE_CHECK_REQUIRE_DB: "1"
      JUDGE_CHECK_REQUIRE_MODEL: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5
      - run: uv python install 3.11  # test on the minimum supported version
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # -rP prints the captured output of passing tests (the query-instruction ablation).
      - run: uv run pytest -v -rP

      # End-to-end demo on the built-in corpus. Not a test: its output is for reading.
      - name: Retrieval demo (ingest, evaluate, raw similarities)
        env:
          JUDGE_CHECK_DATABASE_URL: postgresql+psycopg://judge_check:judge_check@localhost:5433/judge_check_test
        run: |
          uv run alembic upgrade head
          uv run judge-check ingest ../data/hotpotqa_demo --name hotpotqa_demo --replace
          uv run judge-check eval-retrieval --corpus hotpotqa_demo -k 5 --instruction-ablation
          uv run judge-check fusion-sweep --corpus hotpotqa_demo -k 5
          uv run judge-check search "$(head -1 ../data/hotpotqa_demo/questions.jsonl | python3 -c 'import json,sys; print(json.load(sys.stdin)["question"])')" --corpus hotpotqa_demo --compare
          uv run python scripts/show_similarities.py

      # Stage 2: real grounded generation with a small local model. Its output is for reading
      # (and for checking the whole provider -> prompt -> parse -> row path on a real model),
      # not a test: generated answers are never labels (D-032).
      - name: Install Ollama and pull a small model
        working-directory: .
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          if ! curl -sf localhost:11434/api/tags >/dev/null; then
            (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          fi
          for i in $(seq 1 30); do curl -sf localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull qwen2.5:0.5b

      - name: Stage 2 generation demo (Ollama, 20 questions)
        env:
          JUDGE_CHECK_DATABASE_URL: postgresql+psycopg://judge_check:judge_check@localhost:5433/judge_check_test
        run: |
          uv run judge-check generate --corpus hotpotqa_demo --model qwen2.5:0.5b --limit 20 -v

      # The model card's own guidance on the query instruction, verbatim and pinned to the
      # revision we read it at (quoted in DECISIONS.md D-017).
      - name: BGE model card, query-instruction FAQ
        run: |
          REV=$(curl -fsSL https://huggingface.co/api/models/BAAI/bge-small-en-v1.5 \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "BAAI/bge-small-en-v1.5 model card at revision $REV"
          curl -fsSL "https://huggingface.co/BAAI/bge-small-en-v1.5/raw/$REV/README.md" \
            | grep -n -i -A12 "When does the query instruction need to be used" \
            || echo "FAQ heading not found in this revision of the model card"
