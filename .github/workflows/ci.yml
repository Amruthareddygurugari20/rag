name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: judge_check
          POSTGRES_PASSWORD: judge_check
          POSTGRES_DB: judge_check_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U judge_check" --health-interval 2s --health-retries 30
    env:
      # DB-marked tests fail instead of skipping if the database is missing (D-009).
      JUDGE_CHECK_REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11  # test on the minimum supported version
      - run: uv sync --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
